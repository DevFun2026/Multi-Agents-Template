name: Template Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install validation dependencies
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y shellcheck
          npm install -g @openai/codex@0.160.1 @google/gemini-cli@0.62.0

      - name: Validate template structure
        env:
          # Fail instead of skipping if Gemini CLI is missing: the policy
          # example must be proven against the real 0.62.0 policy engine.
          REQUIRE_GEMINI_POLICY_TEST: "1"
        run: bash scripts/verify-template.sh

      - name: Validate Codex project config with doctor
        shell: bash
        run: |
          set -euo pipefail
          export CODEX_HOME="$RUNNER_TEMP/codex-home"
          mkdir -p "$CODEX_HOME"

          cat > "$CODEX_HOME/config.toml" <<EOF
          [projects."$GITHUB_WORKSPACE"]
          trust_level = "trusted"
          EOF

          codex debug prompt-input x > "$RUNNER_TEMP/codex-prompt-input.txt"
          if ! grep -q 'MATCFG' "$RUNNER_TEMP/codex-prompt-input.txt"; then
            echo "Codex project config was not loaded into the model-visible prompt."
            exit 1
          fi

          set +e
          codex doctor 2>&1 | tee "$RUNNER_TEMP/codex-doctor.log"
          doctor_rc=${PIPESTATUS[0]}
          set -e

          echo "codex doctor exit code: $doctor_rc (auth/network failures are expected in unauthenticated CI)"

          if grep -Eqi 'is ignored|malformed agent role' "$RUNNER_TEMP/codex-doctor.log"; then
            echo "Codex doctor reported an ignored config key or malformed agent role."
            exit 1
          fi
