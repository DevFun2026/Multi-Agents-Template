# Copy this file to ~/.gemini/policies/reviewer-network-deny.toml
# for Gemini CLI 0.62.0. Workspace .gemini/policies are currently non-functional.
#
# This is a narrow guardrail for common curl/wget forms, not a complete
# network sandbox. It denies direct curl/wget plus common absolute/relative
# path, env, and VAR=value prefixed forms. Other programs (python, node, nc,
# ssh, etc.) can still open sockets; use Gemini --sandbox for a stronger
# execution boundary.
#
# Gemini constraints these patterns are written for (verified against the
# 0.62.0 policy loader, see scripts/test-gemini-policy.mjs):
# - commandRegex is matched against the JSON-encoded tool args after the
#   literal prefix "command":" so `^` can never match; the closing `"` of the
#   JSON string stands in for end-of-command.
# - Patterns that look like nested quantifiers, e.g. `(env\s+)?` or
#   `(...\s+)*`, are rejected as "potential ReDoS" and the rule is silently
#   dropped. Keep every quantified token outside of a quantified group.
# - These are TOML literal strings: write `\s`, not `\\s`.

[[rule]]
name = "Deny reviewer curl/wget prefixes"
subagent = "reviewer"
toolName = "run_shell_command"
commandPrefix = ["curl", "wget"]
decision = "deny"
priority = 900

[[rule]]
name = "Deny reviewer absolute/relative path curl/wget"
subagent = "reviewer"
toolName = "run_shell_command"
commandRegex = '[^\s"]*/(curl|wget)(\s|")'
decision = "deny"
priority = 901

[[rule]]
name = "Deny reviewer env-wrapped curl/wget"
subagent = "reviewer"
toolName = "run_shell_command"
commandRegex = 'env\s[^"]*(curl|wget)(\s|")'
decision = "deny"
priority = 901

[[rule]]
name = "Deny reviewer VAR=value prefixed curl/wget"
subagent = "reviewer"
toolName = "run_shell_command"
commandRegex = '[A-Za-z_][A-Za-z0-9_]*=[^"]*\s[^\s"]*(curl|wget)(\s|")'
decision = "deny"
priority = 901

[[rule]]
name = "Deny security reviewer curl/wget prefixes"
